name: Generate Gallery JSON

on:
  push:
    paths:
      - 'reimi/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate gallery.json
        run: |
          python3 -c "
          import os, json, random
          exts = {'.jpg', '.jpeg', '.png'}
          files = ['reimi/' + f for f in sorted(os.listdir('reimi')) if os.path.splitext(f)[1].lower() in exts]
          random.shuffle(files)
          open('gallery.json', 'w', encoding='utf-8').write(json.dumps(files, ensure_ascii=False))
          print('gallery.json生成完了:', len(files), '枚')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          git diff --cached --quiet || git commit -m "chore: gallery.json更新" && git push
