name: Generate Gallery JSON

on:
  push:
    paths:
      - 'reimi/**'
  workflow_dispatch:  # 手動実行ボタンを追加

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate gallery.json
        run: |
          python3 - << 'PYEOF'
          import os, json, random

          reimi_dir = 'reimi'
          exts = {'.jpg', '.jpeg', '.png'}

          files = []
          for f in sorted(os.listdir(reimi_dir)):
              if os.path.splitext(f)[1].lower() in exts:
                  files.append('reimi/' + f)

          random.shuffle(files)
          with open('gallery.json', 'w', encoding='utf-8') as out:
              json.dump(files, out, ensure_ascii=False)

          print(f'gallery.json生成完了: {len(files)}枚')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add gallery.json && git commit -m "chore: gallery.json更新" && git push)
