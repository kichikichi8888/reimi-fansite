name: Generate Gallery JSON

on:
  push:
    paths:
      - 'reimi/**'
      - 'reimi_2/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate gallery.json
        run: |
          python3 -c "
          import os, json, random

          dirs = ['reimi', 'reimi_2']
          exts = {'.jpg', '.jpeg', '.png'}
          min_size = 100 * 1024  # 100KB未満は除外

          files = []
          for d in dirs:
              if not os.path.isdir(d):
                  continue
              for f in sorted(os.listdir(d)):
                  ext = os.path.splitext(f)[1].lower()
                  if ext not in exts:
                      continue
                  path = os.path.join(d, f)
                  if os.path.getsize(path) < min_size:
                      continue
                  files.append(d + '/' + f)

          random.shuffle(files)
          open('gallery.json', 'w', encoding='utf-8').write(json.dumps(files, ensure_ascii=False))
          print(f'gallery.json生成完了: {len(files)}枚（reimi + reimi_2、100KB未満は除外）')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          git diff --cached --quiet || git commit -m "chore: gallery.json更新" && git push
